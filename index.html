function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function genCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for (let i = 0; i < 6; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}
function formatTs(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}
function resizeImage(dataUrl, maxWidth) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxWidth / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = dataUrl;
  });
}
function dataUrlToBlob(dataUrl) {
  const [header, base64] = dataUrl.split(',');
  const mime = header.match(/:(.*?);/)[1];
  const bin = atob(base64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

          btn.title = 'Cliquer à nouveau pour confirmer';
          setTimeout(() => {
            if (btn.dataset.confirming === '1') {
              btn.dataset.confirming = '0';
              btn.textContent = '×';
              btn.style.background = '';
              btn.title = 'Supprimer';
            }
          }, 5000);
          return;
        }
        btn.disabled = true;
        try {
          const { error: storageErr } = await sb.storage.from('photos').remove([btn.dataset.path]);
          if (storageErr) throw new Error('Stockage : ' + storageErr.message);
          const { error: dbErr } = await sb.from('photos').delete().eq('id', btn.dataset.id);
          if (dbErr) throw new Error('Base de données : ' + dbErr.message);
          render();
        } catch (err) {
          debugEl.style.color = '#A32D2D';
          debugEl.textContent = 'Erreur : ' + (err && err.message ? err.message : String(err));
          btn.disabled = false;
          btn.dataset.confirming = '0';
          btn.textContent = '×';
          btn.style.background = '';
        }
      };
    });
  }
  renderGrid('entryGrid', entryPhotos, entryUrls, 'entry');
  renderGrid('exitGrid', exitPhotos, exitUrls, 'exit');

  function setupUpload(zoneId, fileId, phase, statusId) {
    const zone = document.getElementById(zoneId);
    const file = document.getElementById(fileId);
    const statusEl = document.getElementById(statusId);
    zone.onclick = () => file.click();
    file.onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      statusEl.textContent = 'Envoi en cours...';
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const resized = await resizeImage(ev.target.result, 1000);
          const blob = dataUrlToBlob(resized);
          const path = `${d.id}/${room.id}/${phase}/${Date.now()}.jpg`;
          const { error: upErr } = await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg' });
          if (upErr) throw upErr;
          const { error: insErr } = await sb.from('photos').insert({
            room_id: room.id, phase, storage_path: path, uploaded_by: state.session.user.id
          });
          if (insErr) throw insErr;
          render();
        } catch (err) {
          statusEl.style.color = '#A32D2D';
          statusEl.textContent = 'Erreur : ' + err.message;
        }
      };
      reader.readAsDataURL(f);
    };
  }
  setupUpload('entryUploadZone', 'entryFile', 'entry', 'entryStatus');
  setupUpload('exitUploadZone', 'exitFile', 'exit', 'exitStatus');

  const aiContent = document.getElementById('aiContent');
  if (entryPhotos.length === 0 || exitPhotos.length === 0) {
    aiContent.innerHTML = '<p class="meta-line">Ajoute au moins une photo d\'entrée et une photo de sortie pour lancer la comparaison.</p>';
  } else if (diffs) {
    renderDiffs(aiContent, diffs);
    aiContent.innerHTML += '<button class="secondary" id="rerunAi">Relancer l\'analyse</button>';
    document.getElementById('rerunAi').onclick = () => runAiComparison(entryUrls[0], exitUrls[0]);
  } else {
    aiContent.innerHTML = '<button class="primary" id="runAi" style="margin-top:0;">Analyser les différences</button><div class="status" id="aiStatus"></div>';
    document.getElementById('runAi').onclick = () => runAiComparison(entryUrls[0], exitUrls[0]);
  }

  function renderDiffs(container, diffsData) {
    if (!diffsData.differences || diffsData.differences.length === 0) {
      container.innerHTML = '<div class="empty-state">Aucune différence significative détectée.</div>';
      return;
    }
    container.innerHTML = diffsData.differences.map(dd => {
      const sev = (dd.severity || 'mineur').toLowerCase();
      return `<div class="diff-card"><span class="badge ${sev === 'majeur' ? 'majeur' : 'mineur'}">${sev === 'majeur' ? 'Majeur' : 'Mineur'}</span><div class="diff-text"><p>${esc(dd.description)}</p><p class="conf">Confiance IA · ${Math.round(dd.confidence)}%</p></div></div>`;
    }).join('') + '<p class="notice">Ces observations doivent être confirmées par les deux parties avant validation.</p>';
  }

  async function urlToBase64(url) {
    const res = await fetch(url);
    const blob = await res.blob();
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.readAsDataURL(blob);
    });
  }

  async function runAiComparison(entryUrl, exitUrl) {
    const btn = document.getElementById('runAi') || document.getElementById('rerunAi');
    if (btn) btn.disabled = true;
    const statusEl = document.getElementById('aiStatus');
    if (statusEl) statusEl.textContent = 'Analyse en cours...';

    const systemPrompt = `Tu es un expert en état des lieux locatif. On te donne deux photos de la même zone d'un logement : une prise à l'entrée du locataire, une prise à la sortie. Compare-les et identifie les différences visibles (taches, rayures, trous, usures anormales, éléments manquants ou cassés). Ignore les différences de luminosité, d'angle de prise de vue ou de meubles déplacés qui ne sont pas des dégradations.

Réponds UNIQUEMENT avec un objet JSON valide, sans texte avant ou après, sans balises markdown, au format exact suivant :
{"differences": [{"description": "description courte en français", "severity": "mineur ou majeur", "confidence": nombre entre 0 et 100}]}

Si aucune différence significative n'est détectée, renvoie {"differences": []}.`;

    try {
      const entryB64 = await urlToBase64(entryUrl);
      const exitB64 = await urlToBase64(exitUrl);
      const response = await fetch("/.netlify/functions/ai-compare", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-5",
          max_tokens: 1000,
          system: systemPrompt,
          messages: [{
            role: "user",
            content: [
              { type: "text", text: `Photos de la pièce : ${room.name}. Photo 1 = entrée. Photo 2 = sortie.` },
              { type: "image", source: { type: "base64", media_type: "image/jpeg", data: entryB64 } },
              { type: "image", source: { type: "base64", media_type: "image/jpeg", data: exitB64 } }
            ]
          }]
        })
      });
      const data = await response.json();
      if (!response.ok || data.type === 'error') {
        const apiMsg = (data.error && data.error.message) || data.error || JSON.stringify(data);
        throw new Error(apiMsg);
      }
      const textBlock = data.content.find(b => b.type === "text");
      if (!textBlock) throw new Error("Réponse inattendue du modèle.");
      const cleaned = textBlock.text.trim().replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(cleaned);
      await sb.from('diffs').insert({ room_id: room.id, differences: parsed });
      render();
    } catch (err) {
      if (statusEl) statusEl.innerHTML = `<div class="error-box">Erreur : ${esc(err.message)}</div>`;
      if (btn) btn.disabled = false;
    }
  }
}
</script>
</body>
</html>
